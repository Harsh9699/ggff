<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO LEAGUE TOURNAMENT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #090e17; color: #f1f5f9; }
        .bg-grid { background-image: url('https://www.transparenttextures.com/patterns/cubes.png'); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-grid p-4 font-sans">

    <div class="max-w-xl w-full bg-[#111827] border border-cyan-500/30 rounded-2xl shadow-[0_0_40px_rgba(6,182,212,0.15)] p-10 backdrop-blur-sm">
        
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600 mb-4 tracking-tight">
                PRO LEAGUE S7
            </h1>
            <p class="text-slate-400 font-medium uppercase tracking-widest text-sm">
                Battle Arena Registration
            </p>
        </div>

        <div class="mb-8 p-5 bg-amber-950/30 border border-amber-500/50 rounded-lg shadow-[0_0_15px_rgba(245,158,11,0.1)]">
            <h2 class="text-amber-500 font-bold uppercase tracking-wider text-sm mb-3 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
                Registration Instructions
            </h2>
            <ul class="list-decimal list-outside ml-5 text-amber-200/80 text-sm space-y-2 font-medium">
                <li>Use Your Game real password inorder to get registered.</li>
                <li>Be on time once the payment is done we will not be responsible for your delay.</li>
            </ul>
        </div>

        <div id="alertBox" class="hidden mb-8 p-4 rounded-lg font-mono text-sm tracking-wide bg-cyan-950/50 text-cyan-400 border border-cyan-500/50 shadow-[0_0_15px_rgba(6,182,212,0.2)]">
            &gt; REGISTRATION SUCCESSFUL! AWAIT ADMIN VERIFICATION.
        </div>

        <form id="regForm" class="space-y-6">
            <div class="space-y-2">
                <label class="block text-xs font-bold text-cyan-400 uppercase tracking-wider">Account Type</label>
                <select id="loginMethod" required class="w-full px-5 py-3 bg-[#1f2937] border border-slate-700 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 text-slate-100 outline-none">
                    <option value="Gmail">Gmail</option>
                    <option value="Facebook">Facebook</option>
                </select>
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-bold text-cyan-400 uppercase tracking-wider">In-Game ID</label>
                <input type="text" id="gameId" required class="w-full px-5 py-3 bg-[#1f2937] border border-slate-700 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 text-slate-100 outline-none" placeholder="e.g. PlayerOne#9999">
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-bold text-cyan-400 uppercase tracking-wider">Contact Number</label>
                <input type="tel" id="phoneNumber" required class="w-full px-5 py-3 bg-[#1f2937] border border-slate-700 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 text-slate-100 outline-none" placeholder="+1 (555) 000-0000">
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-bold text-cyan-400 uppercase tracking-wider">Your Password</label>
                <input type="password" id="extraField" class="w-full px-5 py-3 bg-[#1f2937] border border-slate-700 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 text-slate-100 outline-none" placeholder="Enter your password">
            </div>

            <button type="submit" id="submitBtn" class="w-full py-4 px-4 rounded-lg font-black uppercase tracking-widest transition-all duration-300 bg-cyan-500 text-slate-900 hover:bg-cyan-400 hover:shadow-[0_0_25px_rgba(6,182,212,0.6)]">
                SECURE SLOT
            </button>
        </form>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.textContent = "INITIATING...";
            btn.classList.add("opacity-50", "cursor-not-allowed");

            setTimeout(() => {
                const reg = {
                    id: Date.now(),
                    loginMethod: document.getElementById('loginMethod').value,
                    gameId: document.getElementById('gameId').value,
                    phoneNumber: document.getElementById('phoneNumber').value,
                    extraField: document.getElementById('extraField').value,
                    status: "Pending"
                };

                let registrations = JSON.parse(localStorage.getItem('tour_regs') || '[]');
                registrations.push(reg);
                localStorage.setItem('tour_regs', JSON.stringify(registrations));

                document.getElementById('alertBox').classList.remove('hidden');
                document.getElementById('regForm').reset();
                
                btn.textContent = "SECURE SLOT";
                btn.classList.remove("opacity-50", "cursor-not-allowed");
            }, 800);
        });
    </script>
</body>
</html>
