<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h2>Admin Login</h2>
    <p>Please enter admin credentials.</p>
    <form id="admin-login-form">
        <div class="form-group">
            <label for="admin-id">Admin ID:</label>
            <input type="text" id="admin-id" required>
        </div>
        <div class="form-group">
            <label for="admin-pass">Password:</label>
            <input type="password" id="admin-pass" required>
        </div>
        <button type="submit" class="primary-btn">Login</button>
    </form>
    
    <div id="admin-error" class="message hidden" style="color: red;">
        Invalid credentials!
    </div>
    
    <div style="margin-top: 2rem; font-size: 0.8rem;">
        <a href="index.html">Back to User Registration</a>
    </div>
</div>

<script>
    document.getElementById('admin-login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const id = document.getElementById('admin-id').value;
        const pass = document.getElementById('admin-pass').value;
        
        // Hardcoded admin credentials for demonstration
        if (id === 'admin' && pass === 'admin123') {
            sessionStorage.setItem('adminLoggedIn', 'true');
            window.location.href = 'dashboard.html';
        } else {
            const errorMsg = document.getElementById('admin-error');
            errorMsg.classList.remove('hidden');
            setTimeout(() => {
                errorMsg.classList.add('hidden');
            }, 3000);
        }
    });
</script>
</body>
</html>
